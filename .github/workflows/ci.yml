name: CI

on:
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root dependencies (shared ESLint/Prettier config)
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    name: API (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install root dependencies (shared ESLint/Prettier config)
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - run: npm run build
